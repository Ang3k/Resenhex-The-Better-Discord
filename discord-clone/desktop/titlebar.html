<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'">
<title>Resenhex</title>
<style>
  @font-face { font-family: "Figtree"; font-style: normal; font-weight: 300 900; font-display: swap; src: url("assets/figtree-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "Figtree"; font-style: normal; font-weight: 300 900; font-display: swap; src: url("assets/figtree-latin-ext-wght-normal.woff2") format("woff2"); unicode-range: U+0100-02FF, U+1E00-1EFF; }
  :root { --bg: #141417; --fg: #b3b5bc; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); transition: background-color .2s; }
  body { font: 600 12.5px/1 "Figtree", "Segoe UI", system-ui, sans-serif; color: var(--fg); user-select: none; }
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 30px; display: flex; align-items: center; gap: 8px; padding-left: 12px; -webkit-app-region: drag; }
  .logo { width: 16px; height: 16px; flex-shrink: 0; }
  .name { letter-spacing: .01em; opacity: .9; }
  .update {
    position: fixed; top: 4px; height: 22px; right: calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw) + 8px);
    display: none; align-items: center; gap: 6px; padding: 0 10px 0 7px; border: 0; border-radius: 6px;
    background: #8277fa; color: #fff; font: inherit; font-size: 12px; cursor: pointer; -webkit-app-region: no-drag;
    animation: arrive .35s cubic-bezier(.3, 1.4, .55, 1);
  }
  .update.show { display: flex; }
  .update:hover { background: #6d63e6; }
  .update:active { transform: scale(.96); }
  .update svg { width: 14px; height: 14px; }
  .update:hover svg { animation: nudge .6s ease-in-out infinite; }
  @keyframes arrive { from { opacity: 0; transform: translateY(-6px) scale(.9); } }
  @keyframes nudge { 50% { transform: translateY(2px); } }
  @media (prefers-reduced-motion: reduce) { .update, .update:hover svg { animation: none; } }
</style>
</head>
<body>
  <div class="bar">
    <img class="logo" src="assets/resenhax-logo.png" alt="">
    <span class="name">Resenhex</span>
  </div>
  <button type="button" class="update" id="update" title="Uma versão nova do app foi baixada">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 21h14"/></svg>
    <span>Reiniciar para atualizar</span>
  </button>
  <script src="titlebar.js"></script>
</body>
</html>
