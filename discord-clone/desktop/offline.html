<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self'; font-src 'self'">
<title>Resenhex</title>
<style>
  @font-face { font-family: "Figtree"; font-style: normal; font-weight: 300 900; font-display: swap; src: url("assets/figtree-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "Figtree"; font-style: normal; font-weight: 300 900; font-display: swap; src: url("assets/figtree-latin-ext-wght-normal.woff2") format("woff2"); unicode-range: U+0100-02FF, U+1E00-1EFF; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; background: #1e1e22; color: #dbdce0; user-select: none;
    font: 15px/1.5 "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  main { display: grid; justify-items: center; gap: 14px; max-width: 380px; padding: 24px; text-align: center; animation: rise .4s ease-out; }
  .mark { width: 72px; height: 72px; display: grid; place-items: center; }
  .mark img { width: 100%; height: 100%; object-fit: contain; }
  h1 { margin: 8px 0 0; font-size: 21px; font-weight: 700; color: #f3f3f5; letter-spacing: -.01em; }
  p { margin: 0; color: #8d8f98; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #b3b5bc; }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #b3b5bc; animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  button { margin-top: 6px; height: 40px; padding: 0 20px; border: 0; border-radius: 10px; background: #8277fa; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s, transform .12s; }
  button:hover { background: #6d63e6; }
  button:focus-visible { outline: 2px solid #dbdce0; outline-offset: 3px; }
  button:active { transform: scale(.97); }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
</style>
</head>
<body>
  <main>
    <div class="mark"><img src="assets/resenhax-logo.png" alt=""></div>
    <h1>Sem conexão com o Resenhex</h1>
    <p>Confira sua internet. Se ela estiver funcionando, o servidor pode estar reiniciando e deve voltar em instantes.</p>
    <div class="status"><span class="dots"><i></i><i></i><i></i></span> Tentando reconectar</div>
    <button type="button" id="retry">Tentar agora</button>
  </main>
  <script src="offline.js"></script>
</body>
</html>
